name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust workspace (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run opacus-zk real-prover tests
        run: cargo test -p opacus-zk --features real-prover

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  contracts:
    name: Foundry contracts (wGHOST)
    runs-on: ubuntu-latest
    continue-on-error: true  # forge-std restore pending; tolerated for now
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build --root contracts

      - name: Test contracts
        run: forge test --root contracts
